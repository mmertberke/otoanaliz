<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Otoanaliz - Araç Notları</title>
  <link rel="stylesheet" href="css/stil.css">
</head>
<body>
  <header>
    <h1>Otoanaliz</h1>
    <nav>
      <ul>
        <li><a href="index.html">Ana Sayfa</a></li>
        <li><a href="araclar.html">Araçlar</a></li>
        <li><a href="inceleme.html">Araç İncelemesi</a></li>
        <li><a href="notlar.html">Araç Notları</a></li>
        <li><a href="hakkinda.html">Hakkında</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section>
      <h2>Araç notları</h2>
      <p>İncelediğiniz araç hakkında not yazmak için bu formu hazırladım.</p>
      <p>Form şimdilik sadece görünüm olarak hazır. Yazdığınız notlar kaydedilmez ve sayfa yenilenince kaybolabilir.</p>
      <form id="notFormu">
        <p>
          <label for="arac">Araç seçimi</label><br>
          <select id="arac" name="arac">
            <option value="clio">Renault Clio 1.0 TCe</option>
            <option value="egea">Fiat Egea 1.3 Multijet</option>
            <option value="corolla">Toyota Corolla 1.6 Valvematic</option>
          </select>
        </p>
        <p>
          <label for="baslik">Not başlığı</label><br>
          <input type="text" id="baslik" name="baslik" placeholder="Örn. Bakım hakkında">
        </p>
        <p>
          <label for="not">Notunuz</label><br>
          <textarea id="not" name="not" rows="3" cols="40"></textarea>
        </p>
        <button type="button">Kaydet (henüz çalışmıyor)</button>
      </form>
    </section>
  </main>
</body>
</html>
